<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم تأكيد الحساب بنجاح | Welcome to Fingerprint Reminder</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Minimal Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <img src="logo.svg" alt="Logo" class="brand-logo">
        <div class="brand-title">منبه البصمة الذكي</div>
      </a>
      <a href="index.html" class="btn-nav-download">الرئيسية</a>
    </div>
  </header>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-icon-circle">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <h1>أهلاً بك معنا! تم تأكيد بريدك بنجاح ✨</h1>
      <p>
        شكراً لتأكيد بريدك الإلكتروني. حسابك الآن مفعل بالكامل وجاهز للاستخدام ومزامنة جدول البصمات في أي وقت.
      </p>

      <div class="countdown-box" id="redirectStatus">
        سيتم توجيهك لفتح التطبيق تلقائياً خلال <span id="countdown">5</span> ثوانٍ...
      </div>

      <div style="margin-top:28px; display:flex; flex-direction:column; gap:12px;">
        <!-- Deep Link Attempt & Fallback -->
        <a href="fingerprint://auth/callback" id="openAppBtn" class="btn-submit" style="text-decoration:none; display:inline-block; text-align:center;">
          فتح التطبيق الآن
        </a>

        <a href="https://github.com/kemo1593/fingerprint-app/releases/latest/download/app-release.apk" class="lang-btn" style="text-decoration:none; justify-content:center; padding:12px;">
          لم تقم بتحميل التطبيق بعد؟ اضغط هنا للتحميل المباشر
        </a>
      </div>
    </div>
  </div>

  <script>
    let secondsLeft = 5;
    const countdownEl = document.getElementById('countdown');
    const redirectStatusEl = document.getElementById('redirectStatus');

    // Deep link scheme to open installed app
    const appDeepLink = "fingerprint://auth/callback" + window.location.hash;

    const timer = setInterval(() => {
      secondsLeft--;
      if (countdownEl) {
        countdownEl.textContent = secondsLeft;
      }
      if (secondsLeft <= 0) {
        clearInterval(timer);
        redirectStatusEl.textContent = "جاري فتح التطبيق على هاتفك...";
        // Trigger app opening via intent/deep-link
        window.location.href = appDeepLink;
      }
    }, 1000);
  </script>
</body>
</html>
