<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعيين كلمة المرور الجديدة | Reset Password</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <img src="logo.svg" alt="Logo" class="brand-logo">
        <div class="brand-title">منبه البصمة الذكي</div>
      </a>
      <a href="index.html" class="btn-nav-download">الرئيسية</a>
    </div>
  </header>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-icon-circle">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1>تعيين كلمة المرور الجديدة</h1>
      <p>أدخل كلمة مرور قوية وجديدة لحسابك لتتمكن من تسجيل الدخول والمزامنة.</p>

      <form id="resetForm" onsubmit="handlePasswordReset(event)">
        <div class="form-group">
          <label class="form-label" for="newPassword">كلمة المرور الجديدة</label>
          <input type="password" id="newPassword" class="form-input" placeholder="••••••••" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">تأكيد كلمة المرور</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          حفظ كلمة المرور الجديدة
        </button>

        <div id="statusMessage" class="status-msg"></div>
      </form>

      <div style="margin-top: 24px;">
        <a href="index.html" class="lang-btn" style="text-decoration:none; justify-content:center; padding:10px;">
          العودة للصفحة الرئيسية
        </a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hnwrsxowdrwmoosyjbro.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhud3JzeG93ZHJ3bW9vc3lqYnJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDM3ODgsImV4cCI6MjEwMTUxOTc4OH0.aSf2oslOt8QKBjX7G7wbUONKiVa3ro4dZSV2h3n_o64";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Check for access_token in URL hash from Supabase password reset link
    window.addEventListener('DOMContentLoaded', async () => {
      const hash = window.location.hash;
      const statusEl = document.getElementById('statusMessage');

      if (hash && hash.includes('type=recovery')) {
        // Exchange recovery token
        try {
          const params = new URLSearchParams(hash.substring(1));
          const accessToken = params.get('access_token');
          const refreshToken = params.get('refresh_token');

          if (accessToken) {
            await supabaseClient.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });
          }
        } catch (e) {
          console.error("Session parse error", e);
        }
      }
    });

    async function handlePasswordReset(e) {
      e.preventDefault();
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const statusEl = document.getElementById('statusMessage');
      const submitBtn = document.getElementById('submitBtn');

      statusEl.className = 'status-msg';
      statusEl.style.display = 'none';

      if (newPass !== confirmPass) {
        statusEl.textContent = 'كلمتا المرور غير متطابقتين، يرجى التأكد وإعادة المحاولة';
        statusEl.classList.add('error');
        return;
      }

      if (newPass.length < 6) {
        statusEl.textContent = 'يجب أن تتكون كلمة المرور من 6 أحرف على الأقل';
        statusEl.classList.add('error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الحفظ...';

      try {
        const { data, error } = await supabaseClient.auth.updateUser({
          password: newPass
        });

        if (error) {
          statusEl.textContent = error.message || 'حدث خطأ أثناء تحديث كلمة المرور';
          statusEl.classList.add('error');
        } else {
          statusEl.textContent = 'تم تحديث كلمة المرور بنجاح! يمكنك الآن تسجيل الدخول في التطبيق ✨';
          statusEl.classList.add('success');
          document.getElementById('resetForm').reset();

          // Redirect to app or landing after 4 seconds
          setTimeout(() => {
            window.location.href = "fingerprint://auth/callback";
          }, 3500);
        }
      } catch (err) {
        statusEl.textContent = err.message || 'تعذر الاتصال بالخادم';
        statusEl.classList.add('error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'حفظ كلمة المرور الجديدة';
      }
    }
  </script>
</body>
</html>
